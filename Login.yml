info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}login"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Check if code status is 200", function(){
          expect(res.getStatus()).equals(200);
        })
        const token =  res.body.token;
        test("Check if the token exist", function(){
          let body_res = res.getBody();
          expect(body_res).to.have.property("token")
        })

        bru.setCollectionVar("token", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
